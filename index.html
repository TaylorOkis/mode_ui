<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mode UI</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="banner">
      <div class="wrapper banner__wrapper">
        <a class="banner__tag" href="">Announcement</a>
        <p class="banner__description">
          We are happy to announce that we raise $2 Million in Seed Funding
        </p>
      </div>
    </div>
    <header class="topnav">
      <div class="wrapper topnav__wrapper">
        <a class="topnav__homelink" href="/">
          <img
            class="topnav__logo"
            src="/assets/Images/logo.svg"
            alt="Mode UI homepage"
            width="84"
            height="16"
          />
        </a>

        <div class="topnav__right">
          <a class="topnav__login-button button" href=""
            >Login
            <img
              class="topnav__login-logo"
              src="/assets/Images/icons/login.svg"
              alt=""
              width="17"
              height="17"
          /></a>

          <button>
            <img
              src="/assets/Images/icons/hamburger.svg"
              alt=""
              width="20"
              height="14"
            />
          </button>
        </div>
      </div>
    </header>
    <main></main>
    <footer></footer>
  </body>
</html>
